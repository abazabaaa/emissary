PLACE_NAME = "TikaTextPlace"
SERVICE_NAME = "TIKA_TEXT"
SERVICE_TYPE = "ANALYZE"
SERVICE_DESCRIPTION = "extract text and metadata with Apache Tika 4 in forked JVMs"
SERVICE_COST = 50
SERVICE_QUALITY = 90
SERVICE_PROXY = "*"

# Containers are unpacked by Emissary places; nothing to extract from the container itself.
EXCLUDE_FORM_PREFIX = "ZIP"
EXCLUDE_FORM_PREFIX = "UNKNOWN"
EXCLUDE_FORM_PREFIX = "ERROR"

# Fork pool (shared by the whole node)
NUM_FORKS = 2
FORK_HEAP = "512m"
TASK_TIMEOUT_MILLIS = 120000
PROGRESS_TIMEOUT_MILLIS = 60000
MAX_TEXT_CHARS = 10000000
# Java used for the forks; empty = "java" on PATH. -Ddemo.tika.javaPath overrides (benchmarks).
FORK_JAVA_PATH = ""
