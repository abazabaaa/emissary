PLACE_NAME = "ClaudeOcrPlace"
SERVICE_NAME = "CLAUDE_OCR"
SERVICE_TYPE = "ANALYZE"
SERVICE_DESCRIPTION = "OCR of scanned images and image-only PDFs with Claude (off unless enabled)"
# Higher cost than TikaTextPlace (50), so it runs after Tika has counted the text.
SERVICE_COST = 60
SERVICE_QUALITY = 90
SERVICE_PROXY = "PDF"
SERVICE_PROXY = "IMAGE_PNG"
SERVICE_PROXY = "IMAGE_JPEG"
SERVICE_PROXY = "IMAGE_GIF"
SERVICE_PROXY = "IMAGE_WEBP"
SERVICE_PROXY = "IMAGE_TIFF"
SERVICE_PROXY = "IMAGE_BMP"
# Forms from Emissary's own magic-number identification (UnixFilePlace)
SERVICE_PROXY = "PNG"
SERVICE_PROXY = "JPEG"
SERVICE_PROXY = "GIF"
SERVICE_PROXY = "TIFF"

# Sends document content to Anthropic's API when true. Also needs ANTHROPIC_API_KEY (or another
# credential the Anthropic SDK can find) in the node's environment.
OCR_ENABLED = "false"
MODEL = "claude-opus-5"
EFFORT = "medium"
MAX_TOKENS = 16000
TIMEOUT_SECONDS = 600
MAX_RETRIES = 2

# PDFs are only sent when Tika found fewer than this many characters per page (i.e. scans).
MIN_CHARS_PER_PAGE = 50
PAGES_PER_REQUEST = 5
# API limit is 32 MB per request including base64 (+33%); stay well under it.
MAX_REQUEST_BYTES = 20971520
# Claude's high-resolution limit; larger images are downscaled.
MAX_LONG_EDGE_PX = 2576
RENDER_DPI = 150
